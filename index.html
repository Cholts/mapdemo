            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* Main container for the application */
        #app-container {
            background-color: #ffffff;
            border-radius: 12px; /* Rounded corners for the main container */
            box-shadow: 0 10px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            margin: 20px;
            width: 100%;
            max-width: 1400px; /* Max width for larger screens */
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        h1 {
            color: #10b981; /* Green tone for headings */
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem; /* Larger font for main title */
            font-weight: 700;
        }

        /* Map container for Leaflet */
        #mapid {
            height: 600px; /* Increased height for the main map */
            width: 100%;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        /* Back button styling */
        #back-button {
            background-color: #3b82f6; /* Blue button */
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px; /* Rounded corners */
            cursor: pointer;
            margin-bottom: 25px;
            font-size: 1rem;
            font-weight: 600;
            transition: background-color 0.3s ease, transform 0.2s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }
        #back-button:hover {
            background-color: #2563eb; /* Darker blue on hover */
            transform: translateY(-2px);
        }

        #district-view h2 {
            text-align: center;
            color: #059669; /* Green tone for district name */
            margin-bottom: 30px;
            font-size: 2rem;
            font-weight: 700;
        }

        /* Styling for dig details display */
        #dig-details {
            display: none; /* Hidden by default */
            background-color: #f0fdf4; /* Very light green background */
            border: 1px solid #bbf7d0; /* Light green border */
            border-radius: 8px; /* Rounded corners */
            padding: 25px;
            margin-top: 30px;
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.08);
            animation: fadeIn 0.5s ease-out; /* Fade-in animation */
        }
        #dig-details h3 {
            color: #065f46; /* Dark green for detail title */
            margin-top: 0;
            margin-bottom: 15px;
            font-size: 1.75rem;
            font-weight: 700;
        }
        #dig-details p {
            margin-bottom: 8px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: #374151;
        }
        #dig-details strong {
            color: #14532d; /* Even darker green for strong text */
            font-weight: 600;
        }

        /* Keyframe animation for fade-in effect */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Responsive adjustments */
        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }
            #app-container {
                padding: 20px;
                margin: 10px;
            }
            #back-button {
                padding: 10px 15px;
                font-size: 0.9rem;
            }
            #district-view h2 {
                font-size: 1.75rem;
            }
            #dig-details h3 {
                font-size: 1.5rem;
            }
            #dig-details p {
                font-size: 1rem;
            }
            #mapid {
                height: 400px; /* Adjust map height for smaller screens */
            }
        }

            h1 {
                font-size: 1.75rem;
            }
            #app-container {
                padding: 15px;
                margin: 5px;
            }
            #mapid {
                height: 300px; /* Further adjust map height for very small screens */

        /**

         */
        function initializeFullMap() {
            // If a map instance already exists, remove it to re-initialize cleanly
            if (currentMap) {
                currentMap.remove();
            }

            // Initialize the map centered on Rome with a suitable zoom level
            currentMap = L.map('mapid').setView([41.8902, 12.4922], 12); // Centered on Rome, zoom level 12

            // Add OpenStreetMap tile layer
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {

                attribution: '© <a href="http://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(currentMap);

            // Add the GeoJSON layer for Municipi
            municipiLayer = L.geoJSON(romeMunicipiGeoJSON, {
                style: function (feature) {
                    return {
                        color: '#2e7d32',    // Border color
                        weight: 2,           // Border thickness
                        fillColor: '#4CAF50', // Fill color
                        fillOpacity: 0.3     // Semi-transparent fill
                    };
                },
                onEachFeature: function (feature, layer) {
                    // Bind a tooltip with the Municipio name
                    layer.bindTooltip(feature.properties.name, { permanent: false, direction: 'center' });

                    // Add click event listener to each Municipio polygon
                    layer.on('click', function (e) {
                        showMunicipioSites(feature.properties.name);
                    });

                    // Add hover effects
                    layer.on('mouseover', function (e) {
                        layer.setStyle({
                            fillColor: '#66bb6a', // Lighter green on hover
                            weight: 3,
                            fillOpacity: 0.5
                        });
                    });
                    layer.on('mouseout', function (e) {
                        municipiLayer.resetStyle(layer); // Reset to default style on mouse out
                    });
                }
            }).addTo(currentMap);

            // Add the markers layer group to the map (initially empty)
            markersLayer.addTo(currentMap);

            // Hide the back button
            backButton.classList.add('hidden');
            digDetails.style.display = 'none'; // Hide dig details
            digDetails.innerHTML = ''; // Clear dig details
        }

        /**
         * Displays archaeological sites for a specific Municipio.
         * Zooms to the Municipio and adds markers for its sites.
         * @param {string} municipioName - The name of the Municipio to display sites for.
         */
        function showMunicipioSites(municipioName) {
            // Remove existing markers from the map
            markersLayer.clearLayers();

            const sites = sitesByMunicipio[municipioName] || [];

            // Find the clicked Municipio's layer to get its bounds
            let clickedMunicipioLayer = null;
            municipiLayer.eachLayer(function(layer) {
                if (layer.feature.properties.name === municipioName) {
                    clickedMunicipioLayer = layer;
                }
            });

            if (clickedMunicipioLayer) {
                // Fit map view to the bounds of the clicked Municipio
                currentMap.flyToBounds(clickedMunicipioLayer.getBounds(), {
                    padding: L.point(50, 50) // Add some padding around the bounds
                });
            } else {
                console.warn(`Municipio layer for "${municipioName}" not found.`);
                // Fallback: if Municipio layer not found, try to center on a general Rome area
                currentMap.flyTo([41.8902, 12.4922], 12);
            }

            // Add markers for each archaeological site in the selected Municipio
            if (sites.length > 0) {
                sites.forEach(dig => {
                    // Check if the dig has valid coordinates
                    if (dig.lat && dig.lng) {
                        const marker = L.marker([dig.lat, dig.lng]);
                        // Create a popup for the marker with basic info
                        marker.bindPopup(`<b>${dig['Site / Project']}</b><br>${dig['Year(s)']}`);

                        // Add click event to marker to show full details below the map
                        marker.on('click', () => showDigDetails(dig));
                        markersLayer.addLayer(marker); // Add marker to the markers layer group
                    }
                });
            } else {
                // If no sites found for this Municipio, display a message (optional, could be a toast)
                console.log(`No archaeological sites mapped to ${municipioName} in your data.`);
            }


            // Show the back button
            backButton.classList.remove('hidden');
            digDetails.style.display = 'none'; // Hide dig details initially when zooming
            digDetails.innerHTML = ''; // Clear dig details
        }

        /**
         * Displays the full details of a specific archaeological dig.
         * @param {object} dig - The archaeological dig object containing its details.
         */

            // Populate the dig details section with comprehensive information
            digDetails.innerHTML = `
                <h3 class="text-xl font-bold text-green-800 mb-3">${dig['Site / Project']}</h3>
                <p class="text-gray-700 mb-1"><strong>Year(s):</strong> ${dig['Year(s)']}</p>
                <p class="text-gray-700 mb-1"><strong>Director(s):</strong> ${dig['Director(s)']}</p>
                <p class="text-gray-700"><strong>Description:</strong> ${dig.Description}</p>
                <p class="text-gray-700"><strong>Municipio:</strong> ${dig.municipio || 'N/A'}</p>
            `;
            digDetails.style.display = 'block'; // Make the dig details visible
            digDetails.scrollIntoView({ behavior: 'smooth', block: 'start' }); // Scroll to the details for better UX
